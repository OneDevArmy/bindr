name: CI

on:
  push:
    branches:
      - main
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  checks:
    name: Lint & Test
    runs-on: ubuntu-latest
    concurrency:
      group: bindr-ci-${{ github.ref }}
      cancel-in-progress: true

    steps:
      - name: Checkout sources
        uses: actions/checkout@v4

      - name: Install toolchain
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.88.0
          profile: minimal
          components: clippy rustfmt

      - name: Install LLVM
        run: |
          curl -L -o llvm.tar.xz https://github.com/llvm/llvm-project/releases/download/llvmorg-20.1.5/clang+llvm-20.1.5-x86_64-linux-gnu-ubuntu-22.04.tar.xz
          sudo mkdir -p /opt/llvm
          sudo tar -xJf llvm.tar.xz -C /opt/llvm --strip-components=1
          echo "/opt/llvm/bin" | sudo tee /etc/ld.so.conf.d/llvm.conf
          sudo ldconfig
          echo "/opt/llvm/bin" >> $GITHUB_PATH
          echo "LLVM_DIR=/opt/llvm" >> $GITHUB_ENV

      - name: Cache cargo artifacts
        uses: Swatinem/rust-cache@v2

      - name: Format check
        run: cargo fmt --all -- --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Cargo check
        run: cargo check --all-targets --all-features

      - name: Unit tests
        run: cargo test --all-features -- --nocapture
